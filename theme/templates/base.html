<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f1e5">
  <meta name="description" content="{% block description %}Shelby Lee Neubeck — developer community, content, technical writing and events.{% endblock %}">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/main.css">
  <link rel="alternate" type="application/atom+xml" title="Blog feed" href="{{ SITEURL }}/feeds/all.atom.xml">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="site-shell">
  <header class="site-header">
    <a class="wordmark" href="{{ SITEURL }}/" aria-label="Shelby Lee Neubeck home">shelby<span class="dot">✳</span>neubeck</a>
    <nav aria-label="Main navigation">
      <a href="{{ SITEURL }}/#work">Work</a><a href="{{ SITEURL }}/writing.html">Writing</a><a href="{{ SITEURL }}/resume.html">About / Resume</a><a href="{{ SITEURL }}/blog/">Blog</a>
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <span>Made with curiosity, caffeine & a little chaos. © {{ AUTHOR }}</span>
    <span><a href="mailto:neubeckshelby@gmail.com">Email</a> · <a href="https://www.linkedin.com/in/shelbyneubeck/" rel="me">LinkedIn</a> · <a href="https://github.com/Sneubeck" rel="me">GitHub</a></span>
  </footer>
</div>
</body>
</html>
